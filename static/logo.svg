<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Outfit:wght@700;800;900&amp;display=swap');
      .txt-brand { font-family: 'Outfit', 'Montserrat', sans-serif; font-weight: 900; }
      .txt-tag { font-family: 'Montserrat', sans-serif; font-weight: 800; letter-spacing: 3px; font-size: 14px; fill: #ffffff; }
    </style>
    <linearGradient id="blueArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00c3ff"/>
    </linearGradient>
    <linearGradient id="redArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff002b"/>
      <stop offset="100%" stop-color="#ff3300"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#000000"/>

  <!-- Outer Split Circle Borders -->
  <!-- Blue Arc (Top-Left to Bottom-Left) -->
  <path d="M 256,54 A 202,202 0 0,0 236,457" fill="none" stroke="url(#blueArc)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Red Arc (Top-Right to Bottom-Right) -->
  <path d="M 276,54 A 202,202 0 0,1 256,457" fill="none" stroke="url(#redArc)" stroke-width="8" stroke-linecap="round"/>

  <!-- Center Emblem: TZX Logo -->
  <g transform="translate(110, 140) scale(0.95)">
    <!-- White TZ Monogram -->
    <path d="M 10,0 L 175,0 L 150,30 L 75,30 L 130,100 L 155,100 L 140,130 L 35,130 L 90,60 L 40,60 L 10,0 Z" fill="#ffffff"/>
    
    <!-- White Z lower stem -->
    <path d="M 45,65 L 145,65 L 115,130 L 40,130 Z" fill="#ffffff" transform="translate(5, 5)"/>

    <!-- Red Sharp X -->
    <path d="M 155,25 L 210,25 L 285,125 L 230,125 Z" fill="#ff002b"/>
    <path d="M 230,25 L 285,25 L 170,125 L 120,125 Z" fill="#ff002b"/>
  </g>

  <!-- TECHZENX Text -->
  <g transform="translate(256, 340)" text-anchor="middle" class="txt-brand">
    <text font-size="44" letter-spacing="2">
      <tspan fill="#ffffff">TECH</tspan>
      <tspan fill="#00aaff">ZEN</tspan>
      <tspan fill="#ff002b">X</tspan>
    </text>
  </g>

  <!-- Tagline: EXPLORE • LEARN • CREATE -->
  <g transform="translate(256, 368)" text-anchor="middle" class="txt-tag">
    <text font-size="12" letter-spacing="3.5" fill="#ffffff">
      EXPLORE <tspan fill="#00aaff">•</tspan> LEARN <tspan fill="#ff002b">•</tspan> CREATE
    </text>
  </g>

  <!-- YouTube Icon -->
  <g transform="translate(226, 385)">
    <rect x="0" y="0" width="60" height="38" rx="12" ry="12" fill="#ff0000"/>
    <polygon points="24,11 42,19 24,27" fill="#ffffff"/>
  </g>
</svg>
